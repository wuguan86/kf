window:
  class_name: "mmui::MainWindow"
  name: "微信"

listener:
  # 主循环只负责发现消息变化，过高频会造成频繁读取控件树和切换会话。
  scan_interval_seconds: 0.8
  scan_jitter_seconds: 0.5
  # 未读会话扫描会触发真实窗口切换，必须保留秒级间隔，避免短时间连续点多个会话。
  unread_scan_interval_min_seconds: 2.0
  unread_scan_interval_max_seconds: 5.0
  unread_max_per_round: 5
  message_scan_limit: 10

executor:
  # AI 生成回复后，真正写入微信前再等待一段时间，避免接口返回后立即发送。
  send_delay_min_seconds: 2.0
  send_delay_max_seconds: 5.0
  click_move_min_seconds: 0.18
  click_move_max_seconds: 0.55
  # 上一条消息发送成功后，再进入下一次发送前的全局冷却，防止多个客户回复连续切窗发送。
  global_send_interval_min_seconds: 4.0
  global_send_interval_max_seconds: 9.0

server:
  host: "127.0.0.1"
  port: 51234

logging:
  file: "wechat_bridge.log"
  level: "INFO"
  max_bytes: 10485760
  backup_count: 3
